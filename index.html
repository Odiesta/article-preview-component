<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/main.css" />

    <title>Frontend Mentor | Article preview component</title>
  </head>
  <body>
    <div class="article">
      <div class="article__image-wrapper">
        <img
          src="images/drawers.jpg"
          alt="Drawer Image"
          class="article__image"
        />
      </div>
      <main class="article__content">
        <div class="article__text-container">
          <h1 class="article__title">
            Shift the overall look and feel by adding these wonderful touches to
            furniture in your home
          </h1>
          <p class="article__description">
            Ever been in a room and felt like something was missing? Perhaps it
            felt slightly bare and uninviting. I’ve got some simple tips to help
            you make any room feel complete.
          </p>
        </div>
        <div class="article__profile">
          <div class="article__profile-wrapper">
            <img
              src="images/avatar-michelle.jpg"
              alt="Michelle Image"
              class="article__profile-img"
            />
            <div class="article__profile-info">
              <p class="article__profile-name">Michelle Appleton</p>
              <p class="article__profile-date">28 Jun 2020</p>
            </div>
          </div>

          <button class="article__profile-share-btn">
            <img
              class="article__profile-share-btn-img"
              src="images/icon-share.svg"
              alt=""
            />
          </button>
        </div>
      </main>
    </div>

    <!-- <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer> -->
  </body>
</html>
